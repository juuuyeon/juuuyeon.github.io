<details><summary>장표 텍스트 읽기</summary><pre>DESIGN SYSTEM
withland
디자인 시스템의 필요성 인식
명확한 디자인 가이드 없이 협업이 진행되면서 레이아웃, 컬러, 컴포넌트 사용에 일관성이 없었고, 이는 개발팀과의 소통 오류와 개발 일정 지연으로 이어졌습니다. 

이러한 문제를 해결하고 협업 효율을 높이기 위해 디자인 시스템을 구축을 제안하게 되었습니다.
